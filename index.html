<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgenticNotebook</title>

<!-- CodeMirror 5 (vendored locally — no CDN dependency) -->
<link rel="stylesheet" href="vendor/codemirror/codemirror.min.css">
<link rel="stylesheet" href="vendor/codemirror/theme/dracula.min.css">

<!-- highlight.js (vendored locally) -->
<link rel="stylesheet" href="vendor/highlight.js/styles/github-dark.min.css">

<!-- App styles -->
<link rel="stylesheet" href="styles/main.css">
<link rel="stylesheet" href="styles/cells.css">

<!-- CodeMirror 5 scripts (vendored) -->
<script src="vendor/codemirror/codemirror.min.js"></script>
<script src="vendor/codemirror/mode/markdown/markdown.min.js"></script>
<script src="vendor/codemirror/mode/xml/xml.min.js"></script>
<script src="vendor/codemirror/mode/javascript/javascript.min.js"></script>
<script src="vendor/codemirror/mode/css/css.min.js"></script>

<!-- marked + highlight.js (vendored) -->
<script src="vendor/marked.min.js"></script>
<script src="vendor/highlight.min.js"></script>

<!-- App modules — order matters: storage → editor → llm → settings → cells → main -->
<script src="scripts/storage.js"></script>
<script src="scripts/editor.js"></script>
<script src="scripts/llm.js"></script>
<script src="scripts/settings.js"></script>
<script src="scripts/cells.js"></script>
<script src="scripts/main.js"></script>
</head>
<body>

<header class="topbar">
  <div class="brand">📓 AgenticNotebook</div>

  <div class="menubar">
    <details class="menu">
      <summary>File</summary>
      <ul class="menu-items">
        <li data-action="new">New Notebook</li>
        <li data-action="save">Save Notebook</li>
        <li data-action="export">Export as JSON</li>
      </ul>
    </details>
    <details class="menu">
      <summary>Edit</summary>
      <ul class="menu-items">
        <li data-action="add-below">Add Cell Below</li>
        <li data-action="add-above">Add Cell at Top</li>
        <li data-action="clear-outputs">Clear All Outputs</li>
      </ul>
    </details>
  </div>

  <div class="toolbar">
    <button class="icon-btn" id="btn-add-cell"   title="Add Cell"           aria-label="Add Cell">➕</button>
    <button class="icon-btn" id="btn-run-all"    title="Run All Cells"      aria-label="Run All Cells">⏩️</button>
    <button class="icon-btn" id="btn-clear"      title="Clear All Outputs"  aria-label="Clear All Outputs">🧹</button>
    <button class="icon-btn" id="btn-settings"   title="LLM Settings"       aria-label="LLM Settings">⚙️</button>
    <button class="icon-btn" id="btn-theme"      title="Toggle Theme"       aria-label="Toggle Theme">☀️</button>
  </div>
</header>

<main id="notebook"></main>

<!-- Settings modal -->
<div id="settings-modal" class="modal hidden" role="dialog" aria-labelledby="settings-title">
  <div class="modal-content">
    <h2 id="settings-title">⚙ LLM Settings</h2>
    <form id="settings-form">
      <label>
        <span>Base URL</span>
        <input type="text" id="cfg-base-url" placeholder="https://api.deepseek.com" autocomplete="off" required>
      </label>
      <label>
        <span>API Key</span>
        <input type="password" id="cfg-api-key" placeholder="sk-..." autocomplete="off" required>
      </label>
      <label>
        <span>Model</span>
        <input type="text" id="cfg-model" placeholder="deepseek-chat" autocomplete="off" required>
      </label>
      <div class="modal-actions">
        <button type="button" id="cfg-cancel">Cancel</button>
        <button type="submit" id="cfg-save">Save</button>
      </div>
    </form>
    <p class="modal-hint">Defaults are DeepSeek. Any OpenAI-compatible endpoint works.</p>
  </div>
</div>

<script>
  // Fallback for old / no-defer browsers: main.js already calls main() on its own
  // via an IIFE at the bottom of that file. Nothing to do here.
</script>
</body>
</html>
